version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: brandos_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: personal_brand_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: brandos_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  chromadb:
    image: chromadb/chroma:0.5.20
    container_name: brandos_chromadb
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma

  neo4j:
    image: neo4j:5.26-community
    container_name: brandos_neo4j
    restart: always
    environment:
      NEO4J_AUTH: neo4j/password123
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: brandos_api
    restart: always
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/personal_brand_os?schema=public
      - REDIS_URL=redis://redis:6379
      - CHROMADB_URL=http://chromadb:8000
    depends_on:
      - postgres
      - redis
      - chromadb

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: brandos_web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  chromadb_data:
  neo4j_data:
