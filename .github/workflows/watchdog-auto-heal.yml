name: Watchdog - Auto-Heal Daily Post Pipeline

on:
  schedule:
    # Runs every 30 minutes between 09:00 AM and 11:30 AM IST (03:30–06:00 UTC)
    # Checks if today's post succeeded; triggers the main pipeline if not
    - cron: '30 3 * * *'   # 09:00 AM IST
    - cron: '0 4 * * *'    # 09:30 AM IST
    - cron: '30 4 * * *'   # 10:00 AM IST
    - cron: '0 5 * * *'    # 10:30 AM IST
    - cron: '30 5 * * *'   # 11:00 AM IST
    - cron: '0 6 * * *'    # 11:30 AM IST
  workflow_dispatch:        # Allow manual trigger for testing

concurrency:
  group: watchdog-daily-post
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write   # Required to trigger workflows via API

    steps:
      - name: Check if today's daily post already succeeded
        id: check-runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Checking for successful daily post runs today..."

          # Get today's date in UTC (ISO 8601)
          TODAY=$(date -u '+%Y-%m-%d')
          echo "Today's date (UTC): $TODAY"

          # Fetch recent workflow runs for the daily post workflow
          RUNS=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/daily-automated-post.yml/runs?per_page=10")

          echo "Recent runs fetched."

          # Check if any run from today completed with success
          SUCCESS_TODAY=$(echo "$RUNS" | \
            python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          today = '$TODAY'
          runs = data.get('workflow_runs', [])
          found = any(
              r.get('conclusion') == 'success' and r.get('created_at', '').startswith(today)
              for r in runs
          )
          print('true' if found else 'false')
          ")

          echo "Successful run found today: $SUCCESS_TODAY"
          echo "success_today=$SUCCESS_TODAY" >> $GITHUB_OUTPUT

      - name: Trigger daily post pipeline if no success today
        if: steps.check-runs.outputs.success_today == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "No successful post found today. Triggering daily post pipeline..."

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/daily-automated-post.yml/dispatches" \
            -d '{"ref":"main"}')

          if [ "$RESPONSE" = "204" ]; then
            echo "Successfully triggered daily post pipeline (HTTP 204)."
          else
            echo "Failed to trigger pipeline. HTTP response: $RESPONSE"
            exit 1
          fi

      - name: Skip - post already published today
        if: steps.check-runs.outputs.success_today == 'true'
        run: |
          echo "Daily post already published successfully today. Watchdog standing down."
