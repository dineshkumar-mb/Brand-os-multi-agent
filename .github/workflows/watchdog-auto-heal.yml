name: Watchdog - Auto-Heal Daily Post Pipeline

on:
  schedule:
    # Runs every 30 minutes on Tue, Thu, Fri between 09:00 AM and 11:30 AM IST (03:30–06:00 UTC)
    - cron: '30 3 * * 2,4,5'   # 09:00 AM IST
    - cron: '0 4 * * 2,4,5'    # 09:30 AM IST
    - cron: '30 4 * * 2,4,5'   # 10:00 AM IST
    - cron: '0 5 * * 2,4,5'    # 10:30 AM IST
    - cron: '30 5 * * 2,4,5'   # 11:00 AM IST
    - cron: '0 6 * * 2,4,5'    # 11:30 AM IST
  workflow_dispatch:
    inputs:
      force:
        description: 'Force pipeline trigger regardless of day or failure history'
        required: false
        default: 'false'

concurrency:
  group: watchdog-daily-post
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write   # Required to query and trigger workflows via GitHub API

    env:
      SECRETS_CONTEXT: ${{ toJSON(secrets) }}

    steps:
      - name: Validate Scheduled Posting Day
        id: check-day
        run: |
          DOW=$(date -u '+%u') # 1=Mon, 2=Tue, 3=Wed, 4=Thu, 5=Fri, 6=Sat, 7=Sun
          FORCE="${{ github.event.inputs.force || 'false' }}"
          echo "Day of week (UTC): $DOW (1=Mon ... 7=Sun) | Force: $FORCE"

          # Scheduled days: 2 (Tue), 4 (Thu), 5 (Fri)
          if [ "$FORCE" = "true" ] || [ "$DOW" = "2" ] || [ "$DOW" = "4" ] || [ "$DOW" = "5" ]; then
            echo "is_scheduled_day=true" >> $GITHUB_OUTPUT
          else
            echo "Today is not a scheduled post day (Tue, Thu, Fri). Watchdog standing down."
            echo "is_scheduled_day=false" >> $GITHUB_OUTPUT
          fi

      - name: Inspect Today's Runs & Active Executions
        id: check-runs
        if: steps.check-day.outputs.is_scheduled_day == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          echo "Fetching recent workflow runs..."
          TODAY=$(date -u '+%Y-%m-%d')
          echo "Today's date (UTC): $TODAY"

          RUNS=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/daily-automated-post.yml/runs?per_page=30")

          RESULTS=$(echo "$RUNS" | python3 -c "
          import sys, json

          data = json.load(sys.stdin)
          today = '$TODAY'
          force = '$FORCE'.lower() == 'true'

          runs = data.get('workflow_runs', [])
          today_runs = [r for r in runs if r.get('created_at', '').startswith(today)]

          # Check for in-progress or queued runs to prevent concurrency race conditions
          active_runs = [r for r in today_runs if r.get('status') in ['in_progress', 'queued', 'waiting', 'requested']]
          has_active = len(active_runs) > 0
          active_id = str(active_runs[0].get('id', '')) if has_active else ''

          # Check for success today
          success_runs = [r for r in today_runs if r.get('conclusion') == 'success']
          found_success = len(success_runs) > 0

          # Count failures today
          failed_runs = [r for r in today_runs if r.get('conclusion') == 'failure']
          failed_count = len(failed_runs)
          latest_failed_id = str(failed_runs[0].get('id', '')) if failed_runs else ''

          if force:
              should_trigger = not has_active
              reason = 'FORCED_TRIGGER' if should_trigger else 'RUN_ALREADY_ACTIVE'
          elif has_active:
              should_trigger = False
              reason = 'RUN_ALREADY_ACTIVE'
          elif found_success:
              should_trigger = False
              reason = 'ALREADY_SUCCEEDED_TODAY'
          elif failed_count >= 3:
              should_trigger = False
              reason = 'MAX_FAILURE_THRESHOLD_REACHED'
          else:
              should_trigger = True
              reason = 'TRIGGER_ALLOWED'

          print(f'{str(found_success).lower()}|{str(has_active).lower()}|{str(should_trigger).lower()}|{failed_count}|{reason}|{latest_failed_id}|{active_id}')
          ")

          SUCCESS_TODAY=$(echo "$RESULTS" | cut -d'|' -f1)
          HAS_ACTIVE=$(echo "$RESULTS" | cut -d'|' -f2)
          SHOULD_TRIGGER=$(echo "$RESULTS" | cut -d'|' -f3)
          FAILED_COUNT=$(echo "$RESULTS" | cut -d'|' -f4)
          DECISION_REASON=$(echo "$RESULTS" | cut -d'|' -f5)
          LATEST_FAILED_ID=$(echo "$RESULTS" | cut -d'|' -f6)
          ACTIVE_ID=$(echo "$RESULTS" | cut -d'|' -f7)

          echo "Successful run found today: $SUCCESS_TODAY"
          echo "Active run currently running: $HAS_ACTIVE (ID: $ACTIVE_ID)"
          echo "Failed runs today: $FAILED_COUNT"
          echo "Decision reason: $DECISION_REASON"
          echo "Should trigger: $SHOULD_TRIGGER"

          echo "success_today=$SUCCESS_TODAY" >> $GITHUB_OUTPUT
          echo "has_active=$HAS_ACTIVE" >> $GITHUB_OUTPUT
          echo "should_trigger=$SHOULD_TRIGGER" >> $GITHUB_OUTPUT
          echo "failed_count=$FAILED_COUNT" >> $GITHUB_OUTPUT
          echo "decision_reason=$DECISION_REASON" >> $GITHUB_OUTPUT
          echo "latest_failed_id=$LATEST_FAILED_ID" >> $GITHUB_OUTPUT

      - name: Diagnose Failed Run for Authentication Errors
        id: check-auth-error
        if: |
          steps.check-day.outputs.is_scheduled_day == 'true' &&
          steps.check-runs.outputs.should_trigger == 'true' &&
          steps.check-runs.outputs.latest_failed_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          FAILED_RUN_ID: ${{ steps.check-runs.outputs.latest_failed_id }}
        run: |
          echo "Checking whether latest failure was an unrecoverable auth error (Run $FAILED_RUN_ID)..."

          JOBS=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/actions/runs/$FAILED_RUN_ID/jobs")

          FAILED_JOB_ID=$(echo "$JOBS" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          failed_id = ''
          for job in data.get('jobs', []):
              if job.get('conclusion') == 'failure':
                  failed_id = str(job.get('id', ''))
                  break
          print(failed_id)
          " 2>/dev/null || echo "")

          IS_AUTH_ERROR="false"
          if [ -n "$FAILED_JOB_ID" ]; then
            JOB_LOG=$(curl -s -L \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$REPO/actions/jobs/$FAILED_JOB_ID/logs" | tail -n 250 2>/dev/null || echo "")

            if echo "$JOB_LOG" | grep -qi "401\|INVALID_ACCESS_TOKEN\|EXPIRED_ACCESS_TOKEN\|MissingAccessTokenError\|Unauthorized"; then
              echo "CRITICAL: Authentication error detected in latest failed run logs."
              IS_AUTH_ERROR="true"
            fi
          fi

          echo "is_auth_error=$IS_AUTH_ERROR" >> $GITHUB_OUTPUT

      - name: Trigger Daily Post Pipeline
        if: |
          steps.check-day.outputs.is_scheduled_day == 'true' &&
          steps.check-runs.outputs.should_trigger == 'true' &&
          steps.check-auth-error.outputs.is_auth_error != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Triggering daily post pipeline..."

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/daily-automated-post.yml/dispatches" \
            -d '{"ref":"main"}')

          if [ "$RESPONSE" = "204" ]; then
            echo "Successfully dispatched daily post pipeline (HTTP 204)."
          else
            echo "Failed to dispatch pipeline. HTTP response: $RESPONSE"
            exit 1
          fi

      - name: Alert Telegram on Fatal Authentication Error
        if: steps.check-auth-error.outputs.is_auth_error == 'true'
        env:
          REPO: ${{ github.repository }}
          FAILED_ID: ${{ steps.check-runs.outputs.latest_failed_id }}
        run: |
          TELEGRAM_BOT_TOKEN=$(echo "$SECRETS_CONTEXT" | jq -r '.TELEGRAM_BOT_TOKEN // empty')
          TELEGRAM_CHAT_ID=$(echo "$SECRETS_CONTEXT" | jq -r '.TELEGRAM_CHAT_ID // empty')

          echo "⚠️ Watchdog Standing Down: LinkedIn token is expired or unauthorized."
          MSG="🚨 *Watchdog Alert: LinkedIn Token Expired*%0A%0AThe daily post pipeline cannot publish because LINKEDIN_ACCESS_TOKEN is invalid or expired (HTTP 401).%0A%0A• *Run ID*: $FAILED_ID%0A• *Action Required*: Refresh OAuth token and update LINKEDIN_ACCESS_TOKEN in GitHub Secrets.%0A• [Inspect GitHub Run](https://github.com/$REPO/actions/runs/$FAILED_ID)"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d "chat_id=$TELEGRAM_CHAT_ID" \
              -d "text=$MSG" \
              -d "parse_mode=Markdown" || true
          else
            echo "Telegram alert skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret is not set."
          fi

      - name: Alert Telegram on Maximum Failure Threshold
        if: |
          steps.check-day.outputs.is_scheduled_day == 'true' &&
          steps.check-runs.outputs.decision_reason == 'MAX_FAILURE_THRESHOLD_REACHED'
        env:
          REPO: ${{ github.repository }}
          FAILED_COUNT: ${{ steps.check-runs.outputs.failed_count }}
        run: |
          TELEGRAM_BOT_TOKEN=$(echo "$SECRETS_CONTEXT" | jq -r '.TELEGRAM_BOT_TOKEN // empty')
          TELEGRAM_CHAT_ID=$(echo "$SECRETS_CONTEXT" | jq -r '.TELEGRAM_CHAT_ID // empty')

          echo "⚠️ SAFETY HALT: $FAILED_COUNT failed attempts recorded today."
          MSG="⚠️ *Watchdog Safety Halt*%0A%0ADaily post pipeline has failed $FAILED_COUNT times today. Watchdog halted auto-retry to prevent cascading loops.%0A%0A• [Inspect GitHub Workflows](https://github.com/$REPO/actions/workflows/daily-automated-post.yml)"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d "chat_id=$TELEGRAM_CHAT_ID" \
              -d "text=$MSG" \
              -d "parse_mode=Markdown" || true
          else
            echo "Telegram alert skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret is not set."
          fi

      - name: Stand Down - Active Run in Progress
        if: steps.check-runs.outputs.has_active == 'true'
        run: |
          echo "A daily post workflow run is currently active (in progress or queued). Watchdog standing down."

      - name: Stand Down - Post Already Succeeded Today
        if: steps.check-runs.outputs.success_today == 'true'
        run: |
          echo "Daily post already completed successfully today. Watchdog standing down."
