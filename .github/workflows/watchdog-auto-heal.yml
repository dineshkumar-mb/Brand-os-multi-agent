name: Watchdog - Auto-Heal Daily Post Pipeline

on:
  schedule:
    # Runs every 30 minutes on Tue, Thu, Fri between 09:00 AM and 11:30 AM IST (03:30–06:00 UTC)
    - cron: '30 3 * * 2,4,5'   # 09:00 AM IST
    - cron: '0 4 * * 2,4,5'    # 09:30 AM IST
    - cron: '30 4 * * 2,4,5'   # 10:00 AM IST
    - cron: '0 5 * * 2,4,5'    # 10:30 AM IST
    - cron: '30 5 * * 2,4,5'   # 11:00 AM IST
    - cron: '0 6 * * 2,4,5'    # 11:30 AM IST
  workflow_dispatch:        # Allow manual trigger for testing

concurrency:
  group: watchdog-daily-post
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write   # Required to trigger workflows via API

    steps:
      - name: Check if today's daily post already succeeded
        id: check-runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Checking for successful daily post runs today..."

          # Get today's date in UTC (ISO 8601)
          TODAY=$(date -u '+%Y-%m-%d')
          echo "Today's date (UTC): $TODAY"

          # Fetch recent workflow runs for the daily post workflow
          RUNS=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/daily-automated-post.yml/runs?per_page=10")

          echo "Recent runs fetched."

          # Check today's run history (success and failure count)
          RESULTS=$(echo "$RUNS" | \
            python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          today = '$TODAY'
          runs = data.get('workflow_runs', [])
          found_success = any(
              r.get('conclusion') == 'success' and r.get('created_at', '').startswith(today)
              for r in runs
          )
          failed_count = sum(
              1 for r in runs
              if r.get('conclusion') == 'failure' and r.get('created_at', '').startswith(today)
          )
          should_trigger = (not found_success) and (failed_count < 3)
          print(f'{str(found_success).lower()}|{str(should_trigger).lower()}|{failed_count}')
          ")

          SUCCESS_TODAY=$(echo "$RESULTS" | cut -d'|' -f1)
          SHOULD_TRIGGER=$(echo "$RESULTS" | cut -d'|' -f2)
          FAILED_COUNT=$(echo "$RESULTS" | cut -d'|' -f3)

          echo "Successful run found today: $SUCCESS_TODAY"
          echo "Failed runs count today: $FAILED_COUNT"
          echo "Should trigger pipeline: $SHOULD_TRIGGER"

          echo "success_today=$SUCCESS_TODAY" >> $GITHUB_OUTPUT
          echo "should_trigger=$SHOULD_TRIGGER" >> $GITHUB_OUTPUT
          echo "failed_count=$FAILED_COUNT" >> $GITHUB_OUTPUT

      - name: Trigger daily post pipeline if no success today and under failure threshold
        if: steps.check-runs.outputs.should_trigger == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "No successful post found today (and under failure limit). Triggering daily post pipeline..."

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/daily-automated-post.yml/dispatches" \
            -d '{"ref":"main"}')

          if [ "$RESPONSE" = "204" ]; then
            echo "Successfully triggered daily post pipeline (HTTP 204)."
          else
            echo "Failed to trigger pipeline. HTTP response: $RESPONSE"
            exit 1
          fi

      - name: Halt - Max failure threshold reached today
        if: steps.check-runs.outputs.success_today == 'false' && steps.check-runs.outputs.should_trigger == 'false'
        run: |
          echo "⚠️ SAFETY HALT: ${{ steps.check-runs.outputs.failed_count }} failed attempts recorded today."
          echo "Watchdog will not re-trigger to prevent cascading failure loops. Please inspect logs and secrets."

      - name: Skip - post already published today
        if: steps.check-runs.outputs.success_today == 'true'
        run: |
          echo "Daily post already published successfully today. Watchdog standing down."
