name: Scheduled Automated Verified Agent Post

on:
  schedule:
    # Runs on Tue, Thu, Fri at ~09:00 AM IST (03:27 UTC)
    - cron: '27 3 * * 2,4,5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  daily-verified-post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
#     env:
#       SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: personal_brand_os
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "*"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate and Push Prisma Database Schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/personal_brand_os?schema=public
        run: |
          pnpm --filter @brand-os/database db:generate
          pnpm --filter @brand-os/database db:push

      - name: Build Monorepo Workspace Packages
        run: pnpm -r build

      - name: Run Autonomous Verified Agent Swarm & Publish Post
        id: run-swarm
        env:
          NODE_ENV: production
          PUBLISH_MODE: LIVE
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/personal_brand_os?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: default_github_action_secret_token
          NOTIFICATION_CHANNELS: "telegram"
          SECRETS_CONTEXT: ${{ toJSON(secrets) }}

          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORGANIZATION_ID: ${{ secrets.LINKEDIN_ORGANIZATION_ID }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          # MEDIUM_INTEGRATION_TOKEN: ${{ secrets.MEDIUM_INTEGRATION_TOKEN }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}

        run: |
          export TELEGRAM_BOT_TOKEN=$(echo "$SECRETS_CONTEXT" | jq -r '.TELEGRAM_BOT_TOKEN // empty')
          export TELEGRAM_CHAT_ID=$(echo "$SECRETS_CONTEXT" | jq -r '.TELEGRAM_CHAT_ID // empty')

          MAX_RETRIES=3
          ATTEMPT=0
          SUCCESS=false

          until [ $ATTEMPT -ge $MAX_RETRIES ]; do
            ATTEMPT=$((ATTEMPT+1))
            echo "::group::Pipeline Attempt $ATTEMPT of $MAX_RETRIES"
            echo "Starting swarm pipeline attempt $ATTEMPT at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

            if pnpm exec ts-node --transpile-only ./scratch/run_pipeline.ts; then
              echo "Pipeline succeeded on attempt $ATTEMPT"
              SUCCESS=true
              echo "::endgroup::"
              break
            else
              EXIT_CODE=$?
              echo "Pipeline failed on attempt $ATTEMPT with exit code $EXIT_CODE"
              echo "::endgroup::"

              # Exit code 42 indicates a fatal non-recoverable error (e.g. invalid credentials) - do not retry
              if [ $EXIT_CODE -eq 42 ]; then
                echo "Fatal non-recoverable error (exit code 42) detected. Aborting retries immediately."
                break
              fi

              if [ $ATTEMPT -lt $MAX_RETRIES ]; then
                DELAY=$((ATTEMPT * 30))
                echo "Waiting ${DELAY}s before retry $((ATTEMPT+1))..."
                sleep $DELAY
              fi
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "All attempts failed. Pipeline aborted."
            exit 1
          fi

      - name: Upload Dead Letter Queue Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dead-letter-queue
          path: scratch/dead_letter_queue/
          if-no-files-found: ignore

      - name: Send Telegram Alert on Pipeline Failure
        if: failure()
        env:
          SECRETS_CONTEXT: ${{ toJSON(secrets) }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          TELEGRAM_BOT_TOKEN=$(echo "$SECRETS_CONTEXT" | jq -r '.TELEGRAM_BOT_TOKEN // empty')
          TELEGRAM_CHAT_ID=$(echo "$SECRETS_CONTEXT" | jq -r '.TELEGRAM_CHAT_ID // empty')

          MSG="🚨 *Personal Brand OS Daily Post Failed*%0A%0A• *Run ID*: $RUN_ID%0A• *Repository*: $REPO%0A• *Status*: All pipeline attempts failed%0A• [Inspect GitHub Run](https://github.com/$REPO/actions/runs/$RUN_ID)"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d "chat_id=$TELEGRAM_CHAT_ID" \
              -d "text=$MSG" \
              -d "parse_mode=Markdown" || true
          else
            echo "Telegram alert skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret is not set."
          fi
