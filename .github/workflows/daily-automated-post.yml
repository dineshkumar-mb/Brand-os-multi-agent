name: Daily Automated Verified Agent Post

on:
  schedule:
    # Runs daily at ~09:00 AM IST (03:27 UTC to avoid runner queue congestion on :30)
    - cron: '27 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

concurrency:
  group: linkedin-daily
  cancel-in-progress: false

jobs:
  daily-verified-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "*"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Database Client
        run: pnpm --filter @brand-os/database db:generate

      - name: Build Monorepo Workspace Packages
        run: pnpm -r build

      - name: Run Autonomous Verified Agent Swarm & Publish Post
        env:
          PUBLISH_MODE: LIVE
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORGANIZATION_ID: ${{ secrets.LINKEDIN_ORGANIZATION_ID }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          MEDIUM_INTEGRATION_TOKEN: ${{ secrets.MEDIUM_INTEGRATION_TOKEN }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: npx ts-node --transpile-only scratch/run_pipeline.ts

      - name: Upload Dead Letter Queue Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dead-letter-queue
          path: scratch/dead_letter_queue/
          if-no-files-found: ignore
