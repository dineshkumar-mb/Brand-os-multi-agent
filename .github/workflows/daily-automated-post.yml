name: Daily Automated Verified Agent Post

on:
  schedule:
    # Runs daily at ~09:00 AM IST (03:27 UTC)
    - cron: '27 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  daily-verified-post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: personal_brand_os
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "*"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate and Push Prisma Database Schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/personal_brand_os?schema=public
        run: |
          pnpm --filter @brand-os/database db:generate
          pnpm --filter @brand-os/database db:push

      - name: Build Monorepo Workspace Packages
        run: pnpm -r build

      - name: Run Autonomous Verified Agent Swarm & Publish Post
        id: run-swarm
        env:
          PUBLISH_MODE: LIVE
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/personal_brand_os?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: default_github_action_secret_token
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORGANIZATION_ID: ${{ secrets.LINKEDIN_ORGANIZATION_ID }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          MEDIUM_INTEGRATION_TOKEN: ${{ secrets.MEDIUM_INTEGRATION_TOKEN }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: pnpm exec ts-node --transpile-only ./scratch/run_pipeline.ts

      - name: Upload Dead Letter Queue Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dead-letter-queue
          path: scratch/dead_letter_queue/
          if-no-files-found: ignore

      - name: Send Slack Webhook Notification on Failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "Daily Automated Post Swarm Failed"
          SLACK_MESSAGE: |
            *Pipeline ID*: `${{ steps.run-swarm.outputs.pipeline_id }}`
            *Topic*: ${{ steps.run-swarm.outputs.topic || 'Unknown' }}
            *Error*: `${{ steps.run-swarm.outputs.error }}`
          SLACK_COLOR: "#FF0000"
